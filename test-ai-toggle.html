<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Toggle Test - QuizMaster Pro</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        .loading { background: #fff3cd; color: #856404; }
        pre { background: #e9ecef; padding: 10px; border-radius: 3px; overflow-x: auto; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Toggle Test - QuizMaster Pro</h1>
        
        <div style="margin: 20px 0;">
            <h2>Test AI Question Generation</h2>
            
            <div>
                <label>Topic:</label>
                <input type="text" id="topic" placeholder="e.g., Python Programming" value="JavaScript Programming">
            </div>
            
            <div>
                <label>Difficulty:</label>
                <select id="difficulty">
                    <option value="1">Easy</option>
                    <option value="2" selected>Medium</option>
                    <option value="3">Hard</option>
                </select>
            </div>
            
            <div>
                <label>Count:</label>
                <select id="count">
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
            </div>
            
            <button onclick="testAIGeneration()">🤖 Generate AI Questions</button>
            <button onclick="testGameStart()">🎮 Test Game Start Flow</button>
            <button onclick="clearResults()">🗑️ Clear Results</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        let generatedQuestions = [];
        
        function showResult(content, type = 'result') {
            const resultDiv = document.getElementById('result');
            const className = type === 'error' ? 'result error' : 
                             type === 'success' ? 'result success' :
                             type === 'loading' ? 'result loading' : 'result';
            resultDiv.innerHTML = `<div class="${className}">${content}</div>`;
        }

        function clearResults() {
            document.getElementById('result').innerHTML = '';
            generatedQuestions = [];
        }

        async function testAIGeneration() {
            const topic = document.getElementById('topic').value;
            const difficulty = parseInt(document.getElementById('difficulty').value);
            const count = parseInt(document.getElementById('count').value);
            
            showResult('🤖 Generating AI questions... Please wait.', 'loading');
            
            console.log('🚀 Starting AI Generation Test...');
            console.log('📡 Making request to: http://localhost:3002/api/ai/simple/generate');
            console.log('📝 Payload:', { topic, difficulty, count });
            
            try {
                const response = await fetch('http://localhost:3002/api/ai/simple/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        topic: topic || 'General Knowledge',
                        difficulty: difficulty,
                        count: count,
                        questionType: 'MULTIPLE_CHOICE'
                    })
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', [...response.headers.entries()]);

                if (!response.ok) {
                    throw new Error(`AI service error: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Failed to generate questions');
                }

                generatedQuestions = data.questions;
                
                let html = `
                    <h3>✅ SUCCESS: Generated ${data.questions.length} AI Questions!</h3>
                    <p><strong>Topic:</strong> ${topic || 'General Knowledge'}</p>
                    <p><strong>Difficulty:</strong> ${difficulty}/3</p>
                    <p><strong>Model:</strong> ${data.model} (${data.provider})</p>
                    <hr>
                `;
                
                data.questions.forEach((q, i) => {
                    html += `
                        <div style="margin: 15px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
                            <h4>Question ${i + 1}:</h4>
                            <p><strong>Q:</strong> ${q.questionText}</p>
                            <p><strong>Options:</strong> ${q.options ? q.options.join(', ') : 'N/A'}</p>
                            <p><strong>Answer:</strong> ${q.correctAnswer}</p>
                            <p><strong>Explanation:</strong> ${q.explanation}</p>
                        </div>
                    `;
                });
                
                showResult(html, 'success');
                
            } catch (error) {
                console.error('AI generation error:', error);
                showResult(`❌ ERROR: ${error.message}`, 'error');
            }
        }

        async function testGameStart() {
            if (generatedQuestions.length === 0) {
                showResult('❌ Please generate AI questions first!', 'error');
                return;
            }
            
            showResult('🎮 Testing game start with AI questions...', 'loading');
            
            try {
                // Simulate the game start payload that would be sent
                const gameConfig = {
                    totalQuestions: generatedQuestions.length,
                    categories: [], // Empty for AI questions
                    difficultyLevels: [1, 2, 3],
                    questionTypes: ['MULTIPLE_CHOICE', 'TRUE_FALSE'],
                    timePerQuestion: 30,
                    shuffleQuestions: true,
                    shuffleAnswers: true,
                    showExplanations: true,
                    allowHints: false,
                    pointsPerQuestion: 100,
                    timeBonusEnabled: true,
                    streakBonusEnabled: true,
                    useAI: true,
                    aiTopic: document.getElementById('topic').value,
                    aiQuestions: generatedQuestions
                };
                
                let html = `
                    <h3>🎮 Game Start Configuration Test</h3>
                    <p><strong>✅ AI Mode:</strong> ${gameConfig.useAI}</p>
                    <p><strong>✅ AI Topic:</strong> ${gameConfig.aiTopic}</p>
                    <p><strong>✅ AI Questions:</strong> ${gameConfig.aiQuestions.length} loaded</p>
                    <p><strong>✅ Total Questions:</strong> ${gameConfig.totalQuestions}</p>
                    <hr>
                    <h4>Sample Game Configuration:</h4>
                    <pre>${JSON.stringify(gameConfig, null, 2)}</pre>
                `;
                
                showResult(html, 'success');
                
            } catch (error) {
                showResult(`❌ Game Start Test Error: ${error.message}`, 'error');
            }
        }
        
        // Test on page load
        window.onload = function() {
            showResult('🚀 AI Toggle Test Ready! Click "Generate AI Questions" to test.', 'loading');
        };
    </script>
</body>
</html>
