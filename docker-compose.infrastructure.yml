version: '3.8'

services:
  # Redis for caching and message queues
  redis:
    image: redis:7.2-alpine
    container_name: quizmaster-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    networks:
      - quizmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Sentinel for high availability
  redis-sentinel:
    image: redis:7.2-alpine
    container_name: quizmaster-redis-sentinel
    restart: unless-stopped
    ports:
      - "26379:26379"
    depends_on:
      - redis
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    networks:
      - quizmaster-network

  # PostgreSQL Primary Database
  postgres-primary:
    image: postgres:15-alpine
    container_name: quizmaster-postgres-primary
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-quizmaster}
      POSTGRES_USER: ${DATABASE_USER:-quizmaster}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-quizmaster123}
      POSTGRES_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator123}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./config/postgresql/primary:/docker-entrypoint-initdb.d
    networks:
      - quizmaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-quizmaster}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Read Replica
  postgres-replica:
    image: postgres:15-alpine
    container_name: quizmaster-postgres-replica
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-quizmaster}
      POSTGRES_USER: ${DATABASE_USER:-quizmaster}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-quizmaster123}
      PGUSER: ${DATABASE_USER:-quizmaster}
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator123}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./config/postgresql/replica:/docker-entrypoint-initdb.d
    depends_on:
      - postgres-primary
    networks:
      - quizmaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-quizmaster}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX Load Balancer
  nginx:
    image: nginx:alpine
    container_name: quizmaster-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api-gateway
    networks:
      - quizmaster-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway
    container_name: quizmaster-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - redis
      - postgres-primary
    networks:
      - quizmaster-network
    volumes:
      - ./logs/api-gateway:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.user
    container_name: quizmaster-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      USER_SERVICE_PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      DATABASE_REPLICA_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-replica:5432/${DATABASE_NAME:-quizmaster}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - redis
      - postgres-primary
      - postgres-replica
    networks:
      - quizmaster-network
    volumes:
      - ./logs/user-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Question Service
  question-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.question
    container_name: quizmaster-question-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      QUESTION_SERVICE_PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      DATABASE_REPLICA_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-replica:5432/${DATABASE_NAME:-quizmaster}
    depends_on:
      - redis
      - postgres-primary
      - postgres-replica
    networks:
      - quizmaster-network
    volumes:
      - ./logs/question-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Game Service
  game-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.game
    container_name: quizmaster-game-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GAME_SERVICE_PORT: 3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      DATABASE_REPLICA_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-replica:5432/${DATABASE_NAME:-quizmaster}
    depends_on:
      - redis
      - postgres-primary
      - postgres-replica
    networks:
      - quizmaster-network
    volumes:
      - ./logs/game-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service
  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.ai
    container_name: quizmaster-ai-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AI_SERVICE_PORT: 3004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      - redis
      - postgres-primary
    networks:
      - quizmaster-network
    volumes:
      - ./logs/ai-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Analytics Service
  analytics-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.analytics
    container_name: quizmaster-analytics-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ANALYTICS_SERVICE_PORT: 3005
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      DATABASE_REPLICA_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-replica:5432/${DATABASE_NAME:-quizmaster}
    depends_on:
      - redis
      - postgres-primary
      - postgres-replica
    networks:
      - quizmaster-network
    volumes:
      - ./logs/analytics-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.notification
    container_name: quizmaster-notification-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NOTIFICATION_SERVICE_PORT: 3006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      EMAIL_SERVICE_API_KEY: ${EMAIL_SERVICE_API_KEY}
      SMS_SERVICE_API_KEY: ${SMS_SERVICE_API_KEY}
      PUSH_SERVICE_API_KEY: ${PUSH_SERVICE_API_KEY}
    depends_on:
      - redis
      - postgres-primary
    networks:
      - quizmaster-network
    volumes:
      - ./logs/notification-service:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # File Service
  file-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.file
    container_name: quizmaster-file-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      FILE_SERVICE_PORT: 3007
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${DATABASE_USER:-quizmaster}:${DATABASE_PASSWORD:-quizmaster123}@postgres-primary:5432/${DATABASE_NAME:-quizmaster}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10485760
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:3007}
    depends_on:
      - redis
      - postgres-primary
    networks:
      - quizmaster-network
    volumes:
      - ./logs/file-service:/app/logs
      - file_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring and Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: quizmaster-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - quizmaster-network

  grafana:
    image: grafana/grafana:latest
    container_name: quizmaster-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - quizmaster-network

  # ElasticSearch for logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: quizmaster-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - quizmaster-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: quizmaster-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - quizmaster-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quizmaster-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  postgres_primary_data:
    driver: local
  postgres_replica_data:
    driver: local
  file_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

