# File Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: quizmaster
  labels:
    app: file-service
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
      - name: file-service
        image: quizmaster/file-service:latest
        ports:
        - containerPort: 3007
        env:
        - name: NODE_ENV
          value: production
        - name: FILE_SERVICE_PORT
          value: "3007"
        - name: REDIS_HOST
          value: redis
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: url
        - name: UPLOAD_DIR
          value: /app/uploads
        - name: MAX_FILE_SIZE
          value: "10485760"
        - name: CDN_BASE_URL
          value: https://cdn.quizmaster.dev
        volumeMounts:
        - name: file-storage
          mountPath: /app/uploads
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: file-storage
        persistentVolumeClaim:
          claimName: file-storage-pvc

